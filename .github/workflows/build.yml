name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: tools\build.cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-traffic-light
          if-no-files-found: error
          path: |
            dist/ClaudeTrafficLight.exe
            dist/ClaudeTrafficLightSetup.exe
